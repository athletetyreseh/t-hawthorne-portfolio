<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow,noarchive" />
  <title>Officer Schedule | TH Operations</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="officer-schedule.css?v=20260716-3" />
  <link rel="stylesheet" href="preview-theme.css?v=20261016-2" />
</head>
<body>
  <main class="officer-app">
    <section class="schedule-masthead" aria-label="Schedule overview">
    <header class="hero">
      <div>
        <h1>Officer <em>schedule</em></h1>
        <p id="syncStatus" role="status">Loading schedule...</p>
      </div>
    </header>

    <div class="schedule-toolbar">
    <section class="control-bar" id="weekBar" aria-label="Schedule controls">
      <button class="icon-button" id="previousWeek" type="button" aria-label="Previous week"><svg aria-hidden="true" viewBox="0 0 24 24" focusable="false"><path d="m15 18-6-6 6-6" /></svg></button>
      <div class="week-label">
        <span>Week of</span>
        <strong id="weekText"></strong>
      </div>
      <button class="icon-button" id="nextWeek" type="button" aria-label="Next week"><svg aria-hidden="true" viewBox="0 0 24 24" focusable="false"><path d="m9 18 6-6-6-6" /></svg></button>
      <button class="secondary-button" id="currentWeek" type="button">Current week</button>
    </section>

      <div class="header-signature">
      <button class="secondary-button refresh-button" id="refreshButton" type="button" aria-label="Refresh schedule">
        <svg aria-hidden="true" viewBox="0 0 24 24" focusable="false"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v6h-6" /></svg>
        <span class="button-label">Refresh</span>
      </button>
      <img class="masthead-logo" src="../assets/th-logo-mark.png" alt="Tyrese Hawthorne" width="52" height="48" decoding="async" fetchpriority="high" />
      </div>

    <section class="view-mode-panel" aria-label="Schedule view">
      <button class="mode-button active" id="perGuardMode" type="button" data-view-mode="guard"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M13 4a4 4 0 1 1 0 7M20 21v-2a4 4 0 0 0-3-3.87"/><circle cx="9" cy="7" r="4"/></svg>Per guard</button>
      <button class="mode-button" id="wholeScheduleMode" type="button" data-view-mode="whole"><svg aria-hidden="true" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M3 9h18M9 9v12M15 9v12"/></svg>Whole schedule</button>
      <button class="mode-button" id="overtimeMode" type="button" data-view-mode="overtime"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M8 13V6a1.5 1.5 0 0 1 3 0v6m0-6V3.5a1.5 1.5 0 0 1 3 0V12m0-6.5a1.5 1.5 0 0 1 3 0V13m0-3.5a1.5 1.5 0 0 1 3 0V15a7 7 0 0 1-12.6 4.2l-3-4a1.5 1.5 0 0 1 2.4-1.8L8 15"/></svg>Pick up overtime</button>
    </section>

    </div>

    </section>

    <section class="officer-picker-panel">
      <label>
        Officer
        <select id="officerSelect"></select>
      </label>
      <button class="name-sign-button" id="nameSignButton" type="button">Tap name to sign</button>
      <div class="quick-actions">
        <button class="primary-button" id="requestButton" type="button">Request PTO / change</button>
        <button class="secondary-button" id="signButton" type="button">Sign read receipt</button>
      </div>
    </section>

    <section class="hours-summary" id="hoursSummary"></section>

    <section class="schedule-card">
      <div class="schedule-head" id="scheduleHead"></div>
      <div class="schedule-list" id="scheduleList"></div>
    </section>

    <section class="history-panel">
      <div class="section-title">
        <p class="eyebrow">Request status</p>
        <h2>Your recent requests</h2>
      </div>
      <div id="requestHistory"></div>
    </section>
  </main>


  <dialog id="overtimeDialog" aria-labelledby="overtimeDialogTitle">
    <form id="overtimeForm" method="dialog">
      <div class="dialog-head"><h2 id="overtimeDialogTitle">Request this shift</h2><button class="close-button" type="button" data-close-dialog aria-label="Close overtime request">×</button></div>
      <div class="overtime-shift-summary" id="overtimeShiftSummary"></div>
      <p class="overtime-preview-note" id="overtimePreviewNote" hidden>You’re trying the preview. This request will be simulated.</p>
      <fieldset id="overtimeDetails"><label for="overtimeOfficer">Your name</label><select id="overtimeOfficer" name="officerName" required><option value="">Select your name</option></select><label for="overtimeNotes">Notes <span class="optional-label">optional</span></label><textarea id="overtimeNotes" name="notes" maxlength="1000" rows="3" placeholder="Add anything the scheduler should know"></textarea></fieldset>
      <div id="overtimeReview" hidden></div>
      <p class="overtime-error" id="overtimeFeedback" role="alert" hidden></p>
      <div class="dialog-actions"><button class="secondary-button" type="button" id="overtimeBack" hidden>Back</button><button class="primary-button" type="submit" id="overtimeSubmit">Review request</button></div>
    </form>
  </dialog>

  <dialog id="requestDialog">
    <form id="requestForm" method="dialog">
      <div class="dialog-head">
        <div>
          <p class="eyebrow">New request</p>
          <h2>Time off or schedule change</h2>
        </div>
        <button class="close-button" type="button" data-close-dialog aria-label="Close">x</button>
      </div>
      <div class="form-grid">
        <label>Request type<select name="type" required><option value="pto">PTO</option><option value="unpaid">Unpaid day off</option><option value="late-in">Come in later</option><option value="late-out">Early leave</option></select></label>
        <label>Start date<input type="date" name="startDate" required /></label>
        <label>End date<input type="date" name="endDate" required /></label>
        <label class="time-request-field" id="requestTimeLabel"><span id="requestTimeText">Requested time</span><input type="time" name="requestedTime" /><small id="requestTimeHelp"></small></label>
        <label class="wide">Message<textarea name="message" rows="4" placeholder="Add details for the scheduler"></textarea></label>
      </div>
      <div class="dialog-actions">
        <button class="secondary-button" type="button" data-close-dialog>Cancel</button>
        <button class="primary-button" id="submitRequest" value="submit">Submit request</button>
      </div>
    </form>
  </dialog>

  <dialog id="signatureDialog">
    <form id="signatureForm" method="dialog">
      <div class="dialog-head">
        <div>
          <p class="eyebrow">Read receipt</p>
          <h2>Sign that you read this week</h2>
        </div>
        <button class="close-button" type="button" data-close-dialog aria-label="Close">x</button>
      </div>
      <canvas id="signaturePad" width="720" height="260"></canvas>
      <div class="dialog-actions">
        <button class="secondary-button" id="clearSignature" type="button">Clear</button>
        <button class="primary-button" id="saveSignature" value="submit">Save signature</button>
      </div>
    </form>
  </dialog>

  <script>
    (() => {
      const host = location.hostname;
      const isPreview = host.endsWith(".t-hawthorne-portfolio.pages.dev");
      if (!isPreview) return;
      document.documentElement.classList.add("schedule-preview");
      const label = document.querySelector(".hero .eyebrow");
      if (label) label.textContent = "Visual improvements preview";
      const banner = document.createElement("div");
      banner.className = "preview-banner";
      banner.setAttribute("role", "status");
      banner.innerHTML = "<strong>Preview · read only</strong><span>Showing the current schedule. Requests and signatures are disabled here.</span>";
      document.querySelector(".schedule-masthead").append(banner);
      const lockActions = () => ["requestButton", "signButton", "nameSignButton"].forEach((id) => {
        const button = document.getElementById(id);
        if (button && !button.disabled) { button.disabled = true; button.title = "Disabled on the visual improvements preview"; }
      });
      lockActions();
      new MutationObserver(() => { lockActions(); }).observe(document.getElementById("scheduleList"), { childList: true, subtree: true, attributes: true, attributeFilter: ["disabled"] });
    })();
  </script>
  <script src="officer-schedule.js?v=20261016-2"></script>
</body>
</html>
