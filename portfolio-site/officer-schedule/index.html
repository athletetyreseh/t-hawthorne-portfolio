<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow,noarchive" />
  <title>Officer Schedule | TH Operations</title>
  <link rel="stylesheet" href="officer-schedule.css?v=20260716-3" />
  <link rel="stylesheet" href="preview-theme.css?v=20261015-1" />
</head>
<body>
  <main class="officer-app">
    <header class="hero">
      <div>
        <p class="eyebrow">Live officer schedule</p>
        <h1>Weekly assignments</h1>
        <p id="syncStatus">Loading schedule...</p>
      </div>
      <button class="secondary-button refresh-button" id="refreshButton" type="button" aria-label="Refresh schedule">
        <svg aria-hidden="true" viewBox="0 0 24 24" focusable="false"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v6h-6" /></svg>
        <span class="button-label">Refresh</span>
      </button>
    </header>

    <section class="control-bar" id="weekBar" aria-label="Schedule controls">
      <button class="icon-button" id="previousWeek" type="button" aria-label="Previous week"><svg aria-hidden="true" viewBox="0 0 24 24" focusable="false"><path d="m15 18-6-6 6-6" /></svg></button>
      <div class="week-label">
        <span>Week of</span>
        <strong id="weekText"></strong>
      </div>
      <button class="icon-button" id="nextWeek" type="button" aria-label="Next week"><svg aria-hidden="true" viewBox="0 0 24 24" focusable="false"><path d="m9 18 6-6-6-6" /></svg></button>
      <button class="secondary-button" id="currentWeek" type="button">Current week</button>
    </section>

    <section class="view-mode-panel" aria-label="Schedule view">
      <button class="mode-button active" id="perGuardMode" type="button" data-view-mode="guard">Per guard</button>
      <button class="mode-button" id="wholeScheduleMode" type="button" data-view-mode="whole">Whole schedule</button>
    </section>

    <section class="officer-picker-panel">
      <label>
        Officer
        <select id="officerSelect"></select>
      </label>
      <button class="name-sign-button" id="nameSignButton" type="button">Tap name to sign</button>
      <div class="quick-actions">
        <button class="primary-button" id="requestButton" type="button">Request PTO / change</button>
        <button class="secondary-button" id="signButton" type="button">Sign read receipt</button>
      </div>
    </section>

    <section class="hours-summary" id="hoursSummary"></section>

    <section class="schedule-card">
      <div class="schedule-head" id="scheduleHead"></div>
      <div class="schedule-list" id="scheduleList"></div>
    </section>

    <section class="history-panel">
      <div class="section-title">
        <p class="eyebrow">Request status</p>
        <h2>Your recent requests</h2>
      </div>
      <div id="requestHistory"></div>
    </section>
  </main>

  <dialog id="requestDialog">
    <form id="requestForm" method="dialog">
      <div class="dialog-head">
        <div>
          <p class="eyebrow">New request</p>
          <h2>Time off or schedule change</h2>
        </div>
        <button class="close-button" type="button" data-close-dialog aria-label="Close">x</button>
      </div>
      <div class="form-grid">
        <label>Request type<select name="type" required><option value="pto">PTO</option><option value="unpaid">Unpaid day off</option><option value="late-in">Come in later</option><option value="late-out">Early leave</option></select></label>
        <label>Start date<input type="date" name="startDate" required /></label>
        <label>End date<input type="date" name="endDate" required /></label>
        <label class="time-request-field" id="requestTimeLabel"><span id="requestTimeText">Requested time</span><input type="time" name="requestedTime" /><small id="requestTimeHelp"></small></label>
        <label class="wide">Message<textarea name="message" rows="4" placeholder="Add details for the scheduler"></textarea></label>
      </div>
      <div class="dialog-actions">
        <button class="secondary-button" type="button" data-close-dialog>Cancel</button>
        <button class="primary-button" id="submitRequest" value="submit">Submit request</button>
      </div>
    </form>
  </dialog>

  <dialog id="signatureDialog">
    <form id="signatureForm" method="dialog">
      <div class="dialog-head">
        <div>
          <p class="eyebrow">Read receipt</p>
          <h2>Sign that you read this week</h2>
        </div>
        <button class="close-button" type="button" data-close-dialog aria-label="Close">x</button>
      </div>
      <canvas id="signaturePad" width="720" height="260"></canvas>
      <div class="dialog-actions">
        <button class="secondary-button" id="clearSignature" type="button">Clear</button>
        <button class="primary-button" id="saveSignature" value="submit">Save signature</button>
      </div>
    </form>
  </dialog>

  <script>
    (() => {
      const host = location.hostname;
      const isPreview = host.startsWith("visual-improvements.") || (host.endsWith(".pages.dev") && host.includes("visual-improvements"));
      if (!isPreview) return;
      document.documentElement.classList.add("schedule-preview");
      const label = document.querySelector(".hero .eyebrow");
      if (label) label.textContent = "Visual improvements preview";
      const banner = document.createElement("div");
      banner.className = "preview-banner";
      banner.setAttribute("role", "status");
      banner.innerHTML = "<strong>Preview · read only</strong><span>Showing the current schedule. Requests and signatures are disabled here.</span>";
      document.body.prepend(banner);
      const lockActions = () => ["requestButton", "signButton", "nameSignButton"].forEach((id) => {
        const button = document.getElementById(id);
        if (button && !button.disabled) { button.disabled = true; button.title = "Disabled on the visual improvements preview"; }
      });
      const addPhotoCredits = () => {
        const city = document.querySelector("#site-cityscape .site-schedule-head");
        if (city && !city.querySelector(".photo-credit")) {
          const credit = document.createElement("small"); credit.className = "photo-credit";
          const source = document.createElement("a"); source.href = "https://commons.wikimedia.org/wiki/File:CityScape_(6377886441).jpg"; source.target = "_blank"; source.rel = "noopener noreferrer"; source.textContent = "CityScape photo: Alan Stark / Wikimedia Commons";
          const license = document.createElement("a"); license.href = "https://creativecommons.org/licenses/by-sa/2.0/"; license.target = "_blank"; license.rel = "noopener noreferrer"; license.textContent = "CC BY-SA 2.0 · cropped and darkened";
          credit.append(source, document.createTextNode(" · "), license); city.append(credit);
        }
        const block = document.querySelector("#site-block-23 .site-schedule-head");
        if (block && !block.querySelector(".photo-credit")) {
          const credit = document.createElement("small"); credit.className = "photo-credit";
          const source = document.createElement("a"); source.href = "https://www.omniplan.com/work/case-studies/block-23.html"; source.target = "_blank"; source.rel = "noopener noreferrer"; source.textContent = "Block 23 photo: Omniplan"; credit.append(source); block.append(credit);
        }
      };
      lockActions(); addPhotoCredits();
      new MutationObserver(() => { lockActions(); addPhotoCredits(); }).observe(document.getElementById("scheduleList"), { childList: true, subtree: true, attributes: true, attributeFilter: ["disabled"] });
    })();
  </script>
  <script src="officer-schedule.js?v=20260716-3"></script>
</body>
</html>
