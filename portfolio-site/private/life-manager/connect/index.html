<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>Connect Life Manager</title><link rel="stylesheet" href="../life-manager.css?v=20260817-1"></head><body><main><section class="hero"><div><p class="eyebrow">Secure device pairing</p><h1>Connect your Android app.</h1><p>Approving creates revocable access for this phone only. Your Cloudflare password is never shared with the app.</p></div></section><section class="panel" style="max-width:620px"><form id="connectForm" class="pair-form"><label>Pairing code<input id="code" maxlength="8" autocomplete="one-time-code"></label><button>Approve phone</button></form><p id="result" class="helper">The code expires after ten minutes.</p><p><a href="../" style="color:#9e74ff">Open Life Manager dashboard</a></p></section></main><script>const code=document.getElementById('code');code.value=new URLSearchParams(location.search).get('code')||'';document.getElementById('connectForm').addEventListener('submit',async(e)=>{e.preventDefault();const b=e.submitter;b.disabled=true;const out=document.getElementById('result');try{const r=await fetch('../api/pair/approve',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({userCode:code.value})});const p=await r.json();if(!r.ok)throw new Error(p.error||'Pairing failed');out.textContent=`${p.deviceName} approved. Return to Life Manager on your phone.`;out.style.color='#9cf5c7'}catch(error){out.textContent=error.message;out.style.color='#ffc0c9'}finally{b.disabled=false}});</script></body></html>
