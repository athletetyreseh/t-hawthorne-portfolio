<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow,noarchive" />
  <title>Officer Schedule | TH Operations</title>
  <link rel="stylesheet" href="officer-schedule.css?v=20260630-5" />
</head>
<body>
  <main class="officer-app">
    <header class="hero">
      <div>
        <p class="eyebrow">Live officer schedule</p>
        <h1>Weekly assignments</h1>
        <p id="syncStatus">Loading schedule...</p>
      </div>
      <button class="secondary-button" id="refreshButton" type="button">Refresh</button>
    </header>

    <section class="control-bar" id="weekBar" aria-label="Schedule controls">
      <button class="icon-button" id="previousWeek" type="button" aria-label="Previous week">&lt;</button>
      <div class="week-label">
        <span>Week of</span>
        <strong id="weekText"></strong>
      </div>
      <button class="icon-button" id="nextWeek" type="button" aria-label="Next week">&gt;</button>
      <button class="secondary-button" id="currentWeek" type="button">Current week</button>
    </section>

    <section class="view-mode-panel" aria-label="Schedule view">
      <button class="mode-button active" id="perGuardMode" type="button" data-view-mode="guard">Per guard</button>
      <button class="mode-button" id="wholeScheduleMode" type="button" data-view-mode="whole">Whole schedule</button>
    </section>

    <section class="officer-picker-panel">
      <label>
        Officer
        <select id="officerSelect"></select>
      </label>
      <button class="name-sign-button" id="nameSignButton" type="button">Tap name to sign</button>
      <div class="quick-actions">
        <button class="primary-button" id="requestButton" type="button">Request PTO / change</button>
        <button class="secondary-button" id="signButton" type="button">Sign read receipt</button>
      </div>
    </section>

    <section class="hours-summary" id="hoursSummary"></section>

    <section class="schedule-card">
      <div class="schedule-head" id="scheduleHead"></div>
      <div class="schedule-list" id="scheduleList"></div>
    </section>

    <section class="history-panel">
      <div class="section-title">
        <p class="eyebrow">Request status</p>
        <h2>Your recent requests</h2>
      </div>
      <div id="requestHistory"></div>
    </section>
  </main>

  <dialog id="requestDialog">
    <form id="requestForm" method="dialog">
      <div class="dialog-head">
        <div>
          <p class="eyebrow">New request</p>
          <h2>Time off or schedule change</h2>
        </div>
        <button class="close-button" type="button" data-close-dialog aria-label="Close">x</button>
      </div>
      <div class="form-grid">
        <label>Request type<select name="type" required><option value="pto">PTO</option><option value="unpaid">Unpaid day off</option><option value="late-in">Come in later</option><option value="late-out">Early leave</option></select></label>
        <label>Start date<input type="date" name="startDate" required /></label>
        <label>End date<input type="date" name="endDate" required /></label>
        <label class="time-request-field" id="requestTimeLabel"><span id="requestTimeText">Requested time</span><input type="time" name="requestedTime" /><small id="requestTimeHelp"></small></label>
        <label class="wide">Message<textarea name="message" rows="4" placeholder="Add details for the scheduler"></textarea></label>
      </div>
      <div class="dialog-actions">
        <button class="secondary-button" type="button" data-close-dialog>Cancel</button>
        <button class="primary-button" id="submitRequest" value="submit">Submit request</button>
      </div>
    </form>
  </dialog>

  <dialog id="signatureDialog">
    <form id="signatureForm" method="dialog">
      <div class="dialog-head">
        <div>
          <p class="eyebrow">Read receipt</p>
          <h2>Sign that you read this week</h2>
        </div>
        <button class="close-button" type="button" data-close-dialog aria-label="Close">x</button>
      </div>
      <canvas id="signaturePad" width="720" height="260"></canvas>
      <div class="dialog-actions">
        <button class="secondary-button" id="clearSignature" type="button">Clear</button>
        <button class="primary-button" id="saveSignature" value="submit">Save signature</button>
      </div>
    </form>
  </dialog>

  <script src="officer-schedule.js?v=20260630-5"></script>
</body>
</html>
